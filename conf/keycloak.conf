# Development logging for the Adaptive MFA SPI.
#
# Keeps Keycloak itself at INFO and raises the extension's own categories
# (authenticators, event listener, amfa-api resource, Guards) to DEBUG so you
# can trace risk decisions, webhook ingestion, and admin-API calls locally.
#
# Use it one of two ways with Keycloak 26+:
#   - mount this file at /opt/keycloak/conf/keycloak.conf, or
#   - set the equivalent env var:  KC_LOG_LEVEL="info,org.keycloak.amfa:debug"
#
# Do NOT ship this in production: DEBUG logs are verbose and may include
# request context useful only for debugging.
log-level=info,org.keycloak.amfa:debug
